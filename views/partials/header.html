<a class="skip-link" href="#main">{{t:nav.skip}}</a>
<div class="utility-bar">
  <div class="container utility-inner">
    <div class="lang-switch" role="group" aria-label="{{t:util.language}}">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="kn" lang="kn">ಕನ್ನಡ</button>
      <button type="button" data-lang="hi" lang="hi">हिन्दी</button>
    </div>
    <div class="utility-tools">
      <button type="button" id="helpline-button"><span class="tool-icon" aria-hidden="true">🚨</span><span class="tool-text">Emergency Helplines</span></button>
      <button type="button" id="role-gate-button"><span class="tool-icon" aria-hidden="true">🏛️</span><span class="tool-text">{{t:footer.official}}</span></button>
      <button type="button" id="text-toggle" aria-pressed="false" data-on="{{t:util.textNormal}}" data-off="{{t:util.textLarge}}" data-on-icon="A" data-off-icon="A+"><span class="tool-icon" aria-hidden="true">A+</span><span class="tool-text">{{t:util.textLarge}}</span></button>
      <button type="button" id="theme-toggle" aria-pressed="false" data-on="{{t:util.light}}" data-off="{{t:util.dark}}" data-on-icon="☀" data-off-icon="☾"><span class="tool-icon" aria-hidden="true">☾</span><span class="tool-text">{{t:util.dark}}</span></button>
    </div>
  </div>
</div>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#111111"/>
        <path d="M12 13V8h8v5" fill="none" stroke="#e11d2e" stroke-width="2" stroke-linejoin="round"/>
        <rect x="7" y="13.5" width="18" height="11.5" rx="2" fill="#fff"/>
        <rect x="11" y="16.5" width="10" height="2" rx="1" fill="#e11d2e"/>
      </svg>
      <span class="brand-text"><strong>{{siteName}}</strong><small>{{region}}</small></span>
    </a>
    <div class="header-actions">
      <a class="btn btn-primary btn-sm" href="/submit"><span aria-hidden="true">+</span> {{t:submit.send}}</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{{t:nav.menu}}</button>
    </div>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a href="/browse">{{t:nav.browse}}</a>
      <a href="/map">{{t:nav.map}}</a>
      <a href="/polls">{{t:nav.polls}}</a>
      <a href="/notices">{{t:nav.notices}}</a>
      <a href="/track">{{t:nav.track}}</a>
      <a href="/dashboard">{{t:nav.dashboard}}</a>
      <a class="btn btn-primary btn-sm" href="/submit">{{t:nav.submit}}</a>
    </nav>
  </div>
</header>
